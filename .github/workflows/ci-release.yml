name: CI Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Validate .NET 10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SmartPacking.slnx

      - name: Build Release
        run: dotnet build SmartPacking.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format SmartPacking.slnx --verify-no-changes --no-restore

      - name: Test Release
        run: >-
          dotnet test SmartPacking.slnx --configuration Release
          --no-build --no-restore
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      - name: Publish web host
        run: >-
          dotnet publish src/SmartPacking.Api/SmartPacking.Api.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/publish/web

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartpacking-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download published artifacts
        uses: actions/download-artifact@v4
        with:
          name: smartpacking-${{ github.sha }}
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tar -czf smartpacking-web.tar.gz -C artifacts/publish/web .
          gh release create "$TAG_NAME" smartpacking-web.tar.gz --title "$TAG_NAME" --generate-notes
