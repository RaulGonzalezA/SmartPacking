name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore SmartPacking.slnx
      - run: dotnet build SmartPacking.slnx --configuration Release --no-restore
      - run: dotnet test SmartPacking.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  release:
    name: Publish release artifact
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet publish src/SmartPacking.Api/SmartPacking.Api.csproj --configuration Release --no-restore --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: smartpacking-${{ github.ref_name }}
          path: publish
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: publish/**
