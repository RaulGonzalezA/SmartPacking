<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso · SmartPacking</title><link rel="stylesheet" href="/styles.css"><style>.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,460px);background:#fffdfa;border:1px solid rgba(25,58,84,.1);border-radius:20px;box-shadow:0 18px 45px rgba(25,58,84,.12);padding:38px}.auth-card h1{font-size:3rem;margin:8px 0 14px}.auth-card p{color:#64727c;line-height:1.55}.auth-actions{display:grid;gap:10px;margin:26px 0 18px}.auth-actions a{text-align:center;text-decoration:none}.auth-actions .secondary-link{background:white;color:#193a54;border:1px solid #193a54;box-shadow:none}.auth-note{font-size:.78rem;margin:0}</style></head><body><main class="auth-page"><section class="auth-card" aria-labelledby="login-title"><span class="eyebrow">SMARTPACKING</span><h1 id="login-title">Tu próximo viaje, mejor preparado.</h1><p>Accede para guardar tus viajes, maletas, viajeros y recomendaciones de forma privada.</p><div class="auth-actions"><a class="button" href="/auth/login">Iniciar sesión</a><a class="button secondary-link" href="/auth/register">Crear cuenta</a></div><p class="auth-note">El registro se realiza de forma segura con el proveedor de identidad configurado.</p></section></main></body></html>
